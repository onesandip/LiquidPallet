  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- SOUND ENGINE (Web Audio API Haptics) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick(freq = 420) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }
      playDrip() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch (e) {}
      }
      playSuccess() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.09, this.ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + idx * 0.09 + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.09);
            osc.stop(this.ctx.currentTime + idx * 0.09 + 0.45);
          });
        } catch (e) {}
      }
    }
    const sound = new SoundEngine();

    // --- P0: PHYSICAL COFFEE COLOR MIXING ENGINE ---
    function normalizeRecipe(raw = {}) {
      const coffee = Math.max(20, Math.min(100, Number(raw.coffee ?? 62)));
      const milk = Math.max(0, Math.min(90, Number(raw.milk ?? 38)));
      const roast = Math.max(1, Math.min(5, Number(raw.roast ?? 3)));
      const sweetness = Math.max(0, Math.min(20, Number(raw.sweetness ?? 6)));
      return { coffee, milk, roast, sweetness };
    }

    function calculateIngredientRatios(recipe) {
      const { coffee, milk, roast, sweetness } = normalizeRecipe(recipe);
      const totalParts = coffee + milk;
      const coffeeRatio = coffee / totalParts;
      const milkRatio = milk / totalParts;
      const roastRatio = (roast - 1) / 4.0;
      const sweetRatio = sweetness / 20.0;

      return {
        coffee,
        milk,
        roast,
        sweetness,
        coffeeRatio,
        milkRatio,
        roastRatio,
        sweetRatio,
        coffeePercent: Math.round(coffeeRatio * 100),
        milkPercent: Math.round(milkRatio * 100)
      };
    }

    function validateCoffeeGamut(r, g, b) {
      r = Math.max(18, Math.min(250, Math.round(r)));
      g = Math.max(9, Math.min(r - 6, Math.round(g)));
      b = Math.max(5, Math.min(g - 4, Math.round(b)));

      return { r, g, b };
    }

    function generateCoffeeID(hex, ratios) {
      const hexClean = hex.replace('#', '');
      const code = hexClean.length >= 4 ? hexClean.slice(0, 4) : '7F42';
      return `LP-${code}`;
    }

    function generateCoffeeName(ratios, rgb) {
      const { milk, roast, coffee, sweetness } = ratios;

      if (milk <= 8) {
        if (roast >= 4) {
          return {
            name: coffee >= 80 ? "Midnight Roast" : "Dark Velvet",
            tagline: "Dense Obsidian • Smoky Cocoa Nibs",
            category: "Near-black espresso"
          };
        } else if (roast >= 2) {
          return {
            name: "Obsidian Flame",
            tagline: "Toasted Walnut • Cedar Extraction",
            category: "Dark brown"
          };
        } else {
          return {
            name: "Amber Extraction",
            tagline: "Meyer Lemon • Honeyed Crema",
            category: "Blonde espresso"
          };
        }
      } else if (milk <= 28) {
        if (roast >= 4) {
          return {
            name: "Caramel Ember",
            tagline: "Burnt Sugar • Roasted Hazelnut",
            category: "Deep mocha"
          };
        } else if (roast >= 2) {
          return {
            name: "Cocoa Mist",
            tagline: "Pecan Bark • Semi-sweet Cocoa",
            category: "Deep mocha"
          };
        } else {
          return {
            name: "Amber Crema",
            tagline: "Warm Honey • Golden Crema",
            category: "Medium coffee brown"
          };
        }
      } else if (milk <= 58) {
        if (roast >= 4) {
          return {
            name: "Golden Mocha",
            tagline: "Bittersweet Truffle • Silky Crema",
            category: "Medium coffee brown"
          };
        } else if (roast >= 2) {
          return {
            name: sweetness >= 12 ? "Brown Sugar Cloud" : "Caramel Ember",
            tagline: "Toasted Toffee • Warm Cinnamon",
            category: "Caramel"
          };
        } else {
          return {
            name: "Cream Drift",
            tagline: "Almond Butter • Sweet Cream",
            category: "Light caramel"
          };
        }
      } else if (milk <= 78) {
        if (roast >= 4) {
          return {
            name: "Toasted Pecan",
            tagline: "Roasted Chestnut • Creamy Microfoam",
            category: "Cream coffee"
          };
        } else if (roast >= 2) {
          return {
            name: "Dawn Silk",
            tagline: "Silky Vanilla • Steamed Cream",
            category: "Cream coffee"
          };
        } else {
          return {
            name: "Blonde Silk",
            tagline: "Sweet Brioche • Delicate Foam",
            category: "Latte"
          };
        }
      } else {
        return {
          name: "Ivory Cloud",
          tagline: "Velvet Cream • Subtle Espresso Mist",
          category: "Latte"
        };
      }
    }

    function generateRecipeDescriptor(ratios) {
      const { coffee, milk, roast, sweetness } = ratios;

      let body = "Balanced";
      if (coffee >= 75) body = "Bold";
      else if (coffee <= 35) body = "Light";

      let dairy = "Balanced Milk";
      if (milk === 0) dairy = "Black";
      else if (milk <= 25) dairy = "Splash";
      else if (milk >= 65) dairy = "Very Creamy";
      else if (milk >= 40) dairy = "Creamy";

      let sweet = "No Sweetness";
      if (sweetness >= 15) sweet = "Sweet";
      else if (sweetness >= 8) sweet = "Medium Sweet";
      else if (sweetness > 0) sweet = "Low Sweetness";

      const text = `${body} · ${dairy} · ${sweet}`;

      const makeBar = (val, max = 100, len = 8) => {
        const filled = Math.min(len, Math.max(0, Math.round((val / max) * len)));
        return "█".repeat(filled) + "░".repeat(len - filled);
      };

      const bars = {
        coffee: makeBar(coffee, 100, 8),
        milk: makeBar(milk, 90, 8),
        roast: makeBar(roast, 5, 8),
        sweetness: makeBar(sweetness, 20, 8)
      };

      return { text, bars };
    }

    function mixCoffeeColor(recipe) {
      const ratios = calculateIngredientRatios(recipe);
      const { coffee, milk, roast, sweetness, milkRatio, roastRatio, sweetRatio } = ratios;
      const coffeeNorm = (coffee - 20) / 80.0;

      // 1. Base espresso across roast spectrum
      const baseR = 110 * (1 - roastRatio) + 22 * roastRatio;
      const baseG = 52 * (1 - roastRatio) + 10 * roastRatio;
      const baseB = 22 * (1 - roastRatio) + 5 * roastRatio;

      // 2. Coffee intensity dilution / concentration
      const dilution = 1.0 - Math.pow(coffeeNorm, 0.9);
      const dilR = baseR + dilution * (175 - baseR) * 0.45;
      const dilG = baseG + dilution * (105 - baseG) * 0.45;
      const dilB = baseB + dilution * (50 - baseB) * 0.45;

      // 3. Milk light scattering (Kubelka-Munk model)
      const pigmentPower = (0.45 + 0.55 * coffeeNorm) * (0.65 + 0.35 * roastRatio);
      const effectiveMilk = Math.pow(milkRatio, 0.70 + 0.40 * pigmentPower);

      let r = Math.round(dilR * (1 - effectiveMilk) + 246 * effectiveMilk);
      let g = Math.round(dilG * (1 - effectiveMilk) + 236 * effectiveMilk);
      let b = Math.round(dilB * (1 - effectiveMilk) + 214 * effectiveMilk);

      // 4. Sweetness subtle luster
      r = Math.min(255, Math.round(r + sweetRatio * 4));
      g = Math.min(255, Math.round(g + sweetRatio * 1));
      b = Math.max(0, Math.round(b - sweetRatio * 3));

      const validated = validateCoffeeGamut(r, g, b);
      const hex = `#${((1 << 24) + (validated.r << 16) + (validated.g << 8) + validated.b).toString(16).slice(1).toUpperCase()}`;

      const coffeeId = generateCoffeeID(hex, ratios);
      const nameData = generateCoffeeName(ratios, validated);
      const descriptors = generateRecipeDescriptor(ratios);

      return {
        ...ratios,
        r: validated.r,
        g: validated.g,
        b: validated.b,
        hex,
        coffeeId,
        name: nameData.name,
        tagline: nameData.tagline,
        descriptors: descriptors.text,
        asciiBars: descriptors.bars,
        toneCategory: nameData.category
      };
    }

    function runColorRegressionTests() {
      const tests = [
        { id: 'test-1', name: '100% Black Coffee', expectedTone: 'Very dark brown / near-black', recipe: { coffee: 90, milk: 0, roast: 4, sweetness: 0 } },
        { id: 'test-2', name: '80% Coffee + 20% Milk', expectedTone: 'Dark brown', recipe: { coffee: 80, milk: 20, roast: 3, sweetness: 0 } },
        { id: 'test-3', name: '60% Coffee + 40% Milk', expectedTone: 'Medium brown / mocha', recipe: { coffee: 60, milk: 40, roast: 3, sweetness: 0 } },
        { id: 'test-4', name: '40% Coffee + 60% Milk', expectedTone: 'Light caramel / latte', recipe: { coffee: 40, milk: 60, roast: 3, sweetness: 0 } },
        { id: 'test-5', name: '20% Coffee + 80% Milk', expectedTone: 'Very light coffee / cream', recipe: { coffee: 20, milk: 80, roast: 3, sweetness: 0 } }
      ];

      const results = tests.map(t => {
        const mixed = mixCoffeeColor(t.recipe);
        const lum = (mixed.r * 0.299 + mixed.g * 0.587 + mixed.b * 0.114);
        return {
          ...t,
          hex: mixed.hex,
          rgb: `rgb(${mixed.r}, ${mixed.g}, ${mixed.b})`,
          luminance: Math.round(lum),
          name: mixed.name,
          category: mixed.toneCategory
        };
      });

      let monotonicPassed = true;
      for (let i = 1; i < results.length; i++) {
        if (results[i].luminance <= results[i - 1].luminance) {
          monotonicPassed = false;
        }
      }

      return { allPassed: monotonicPassed, results };
    }

    const QUICK_ORDER_PRESETS = [
      { id: 'black', label: 'BLACK', sublabel: 'Bold & intense', coffee: 90, milk: 0, roast: 4, sweetness: 0 },
      { id: 'balanced', label: 'BALANCED', sublabel: 'Classic everyday coffee', coffee: 62, milk: 38, roast: 3, sweetness: 6 },
      { id: 'creamy', label: 'CREAMY', sublabel: 'Smooth & milky', coffee: 35, milk: 75, roast: 2, sweetness: 8 },
      { id: 'bold', label: 'BOLD', sublabel: 'Strong & dark', coffee: 85, milk: 18, roast: 4, sweetness: 0 },
      { id: 'sweet', label: 'SWEET', sublabel: 'Dessert-like', coffee: 50, milk: 55, roast: 3, sweetness: 18 }
    ];

    function generateSensibleSurprise() {
      const coffee = Math.floor(Math.random() * (90 - 30 + 1)) + 30;
      const milk = Math.floor(Math.random() * (70 - 10 + 1)) + 10;
      const roast = Math.floor(Math.random() * (5 - 2 + 1)) + 2;
      const sweetness = Math.floor(Math.random() * 16);

      return {
        coffee, milk, roast, sweetness,
        ...mixCoffeeColor({ coffee, milk, roast, sweetness })
      };
    }

    // --- PURE SVG QR CODE COMPONENT ---
    function CustomQRCode({ payload, size = 160, hex = '#A96F42' }) {
      const hash = payload.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const cells = 21;
      const grid = useMemo(() => {
        const rows = [];
        for (let r = 0; r < cells; r++) {
          const row = [];
          for (let c = 0; c < cells; c++) {
            const isTopLeft = (r < 7 && c < 7);
            const isTopRight = (r < 7 && c >= cells - 7);
            const isBottomLeft = (r >= cells - 7 && c < 7);

            if (isTopLeft || isTopRight || isBottomLeft) {
              if (r === 0 || r === 6 || c === 0 || c === 6 ||
                  r === 0 || r === 6 || c === cells - 7 || c === cells - 1 ||
                  r === cells - 7 || r === cells - 1 || c === 0 || c === 6) {
                row.push(true);
              } else if (
                (r >= 2 && r <= 4 && c >= 2 && c <= 4) ||
                (r >= 2 && r <= 4 && c >= cells - 5 && c <= cells - 3) ||
                (r >= cells - 5 && r <= cells - 3 && c >= 2 && c <= 4)
              ) {
                row.push(true);
              } else {
                row.push(false);
              }
            } else {
              const val = Math.sin(r * 12.9898 + c * 78.233 + hash) * 43758.5453;
              row.push((val - Math.floor(val)) > 0.46);
            }
          }
          rows.push(row);
        }
        return rows;
      }, [payload, hash]);

      const cellSize = size / cells;

      return (
        <div className="relative inline-block p-3 bg-white rounded-2xl shadow-xl border border-white/20">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <rect width={size} height={size} fill="#FFFFFF" />
            {grid.map((row, r) =>
              row.map((active, c) =>
                active ? (
                  <rect
                    key={`${r}-${c}`}
                    x={c * cellSize}
                    y={r * cellSize}
                    width={cellSize}
                    height={cellSize}
                    fill="#1A0D07"
                    rx={cellSize * 0.25}
                  />
                ) : null
              )
            )}
            <circle cx={size / 2} cy={size / 2} r={cellSize * 1.8} fill={hex} stroke="#FFFFFF" strokeWidth="2" />
          </svg>
        </div>
      );
    }

    // --- REALISTIC COFFEE CUP & FLUID CANVAS SIMULATOR ---
    function CoffeeCupCanvas({ colorData, showWindowCallout = false, fillLevel = 1.0, isBrewing = false }) {
      const canvasRef = useRef(null);
      const animationFrameId = useRef(null);

      // Smooth color interpolation ref
      const currentRgb = useRef({ r: colorData.r, g: colorData.g, b: colorData.b });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let t = 0;

        const bubbles = Array.from({ length: 24 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height * 0.7) + (canvas.height * 0.25),
          radius: Math.random() * 2.8 + 1.0,
          speed: Math.random() * 0.35 + 0.15,
          offset: Math.random() * Math.PI * 2
        }));

        const render = () => {
          t += 0.035;

          // Smooth 60fps color interpolation towards target
          currentRgb.current.r += (colorData.r - currentRgb.current.r) * 0.15;
          currentRgb.current.g += (colorData.g - currentRgb.current.g) * 0.15;
          currentRgb.current.b += (colorData.b - currentRgb.current.b) * 0.15;

          const r = Math.round(currentRgb.current.r);
          const g = Math.round(currentRgb.current.g);
          const b = Math.round(currentRgb.current.b);

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const w = canvas.width;
          const h = canvas.height;
          
          const liquidHeight = h * 0.78 * fillLevel;
          const topY = h * 0.88 - liquidHeight;

          if (liquidHeight > 10) {
            ctx.save();
            
            ctx.beginPath();
            ctx.moveTo(w * 0.14, h * 0.12);
            ctx.lineTo(w * 0.86, h * 0.12);
            ctx.lineTo(w * 0.77, h * 0.88);
            ctx.lineTo(w * 0.23, h * 0.88);
            ctx.closePath();
            ctx.clip();

            const gradient = ctx.createLinearGradient(0, topY, 0, h * 0.88);
            gradient.addColorStop(0, `rgb(${r}, ${g}, ${b})`);
            gradient.addColorStop(0.7, `rgb(${Math.max(0, r - 22)}, ${Math.max(0, g - 22)}, ${Math.max(0, b - 22)})`);
            gradient.addColorStop(1, `rgb(${Math.max(0, r - 38)}, ${Math.max(0, g - 38)}, ${Math.max(0, b - 38)})`);

            ctx.beginPath();
            ctx.moveTo(0, topY);
            for (let x = 0; x <= w; x += 4) {
              const wave1 = Math.sin(x * 0.03 + t) * (isBrewing ? 7 : 3.5);
              const wave2 = Math.cos(x * 0.05 - t * 0.8) * (isBrewing ? 5 : 2);
              ctx.lineTo(x, topY + wave1 + wave2);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Crema foam top edge
            ctx.beginPath();
            for (let x = 0; x <= w; x += 4) {
              const wave1 = Math.sin(x * 0.03 + t) * (isBrewing ? 7 : 3.5);
              const wave2 = Math.cos(x * 0.05 - t * 0.8) * (isBrewing ? 5 : 2);
              ctx.lineTo(x, topY + wave1 + wave2);
            }
            ctx.strokeStyle = `rgba(255, 245, 220, 0.45)`;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Crema bubbles
            bubbles.forEach(bubble => {
              bubble.y -= bubble.speed * (isBrewing ? 2.5 : 1);
              if (bubble.y < topY + 6) {
                bubble.y = h * 0.86;
                bubble.x = w * 0.25 + Math.random() * (w * 0.5);
              }
              const wobble = Math.sin(t + bubble.offset) * 3;
              ctx.beginPath();
              ctx.arc(bubble.x + wobble, bubble.y, bubble.radius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255, 250, 235, 0.45)`;
              ctx.fill();
            });

            if (isBrewing && fillLevel < 0.98) {
              ctx.beginPath();
              ctx.moveTo(w * 0.5 - 4, 0);
              ctx.lineTo(w * 0.5 + 4, 0);
              ctx.lineTo(w * 0.5 + 6, topY);

              ctx.closePath();
              ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.85)`;
              ctx.fill();
            }

            ctx.restore();
          }

          animationFrameId.current = requestAnimationFrame(render);
        };

        return () => {

            cancelAnimationFrame(animationFrameId.current);
          }
        };

                          </div>
                          <div className="text-[11px] text-neutral-400 mt-0.5">Expected: <span className="text-neutral-300">{t.expectedTone}</span></div>
                          <div className="text-[10px] font-mono text-neutral-500 mt-0.5">
                            Recipe: {t.recipe.coffee}% C · {t.recipe.milk}% M · R{t.recipe.roast} · Luminance: {t.luminance}
                          </div>
                        </div>
                      </div>

                      <button
                        onClick={() => {
                          setCoffee(t.recipe.coffee);
                          setMilk(t.recipe.milk);
                          setRoast(t.recipe.roast);
                          setSweetness(t.recipe.sweetness);
                          setShowTestBenchModal(false);
                          setCurrentScreen('creator');
                        }}
                        className="px-3 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 border border-amber-500/40 text-xs font-mono font-bold transition-all"
                      >
                        LOAD
                      </button>
                    </div>
                  ))}
                </div>

                <div className="pt-3 border-t border-white/10 text-[11px] text-neutral-400 space-y-1 font-mono">
                  <div className="text-white font-bold">Physical Model Guarantees:</div>
                  <div>• Milk ↑ strictly increases optical scattering (never darkens).</div>
                  <div>• Coffee Intensity ↑ increases dye optical density (never lightens).</div>
                  <div>• Roast Level ↑ deepens caramelization absorption (never lightens).</div>
                  <div>• Sweetness alters descriptor & surface luster without corrupting color.</div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LiquidPaletteApp />);
  </script>
</body>
</html>
