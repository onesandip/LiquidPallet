      border: 3px solid #1A0D07;

    /* Glassmorphism helpers */

      border: 1px solid rgba(255, 255, 255, 0.08);

    .glass-border-glow {

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.04); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- SOUND ENGINE (Web Audio API Haptics) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick(freq = 420) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }
      playDrip() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch (e) {}
      }
      playSuccess() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.09, this.ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + idx * 0.09 + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.09);
            osc.stop(this.ctx.currentTime + idx * 0.09 + 0.45);
          });
        } catch (e) {}
      }
    }
    const sound = new SoundEngine();

    // --- COFFEE COLOR BLENDING ENGINE ---
    // Realistic Kubelka-Munk style fluid optical blending
    function blendCoffeePhysics(coffee, milk, roast, sweetness) {
      // coffee: 20 to 100
      // milk: 0 to 90
      // roast: 1 (Light Blonde) to 5 (Dark Italian)
      // sweetness: 0 to 20

      const roastNorm = (roast - 1) / 4; // 0.0 (Light Blonde) to 1.0 (Dark Italian)
      const coffeeNorm = (coffee - 20) / 80; // 0.0 (Light 20%) to 1.0 (Strong 100%)

      // 1. Base espresso pigment colors across roast spectrum:
      // Roast 1 (Blonde): Warm vibrant golden/cinnamon amber
      // Roast 5 (Dark Italian): Deep obsidian black-brown
      const blondeR = 178, blondeG = 104, blondeB = 40;
      const darkR = 24,   darkG = 11,   darkB = 6;

      let baseR = Math.round(blondeR * (1 - roastNorm) + darkR * roastNorm);
      let baseG = Math.round(blondeG * (1 - roastNorm) + darkG * roastNorm);
      let baseB = Math.round(blondeB * (1 - roastNorm) + darkB * roastNorm);

      // 2. Coffee Intensity effect on base coffee:
      // Low intensity (20%) dilutes the pigment, making it lighter and more translucent
      // High intensity (100%) concentrates the pigment, making it dark, rich, and opaque
      const dilution = (1 - coffeeNorm); // 1.0 at 20% coffee, 0.0 at 100% coffee
      baseR = Math.round(baseR + dilution * (224 - baseR) * 0.48);
      baseG = Math.round(baseG + dilution * (172 - baseG) * 0.48);
      baseB = Math.round(baseB + dilution * (116 - baseB) * 0.48);

      // 3. Milk blending with pigment-power weighting:
      const milkNorm = milk / 100;
      const milkR = 248, milkG = 240, milkB = 224;

      // Higher coffee intensity and darker roast resist milk lightening
      const pigmentPower = (0.35 + 0.65 * coffeeNorm) * (0.65 + 0.35 * roastNorm);
      // Milk visual weight curve:
      const visualMilk = Math.pow(milkNorm, 0.58 + 0.48 * pigmentPower);

      let r = Math.round(baseR * (1 - visualMilk) + milkR * visualMilk);
      let g = Math.round(baseG * (1 - visualMilk) + milkG * visualMilk);
      let b = Math.round(baseB * (1 - visualMilk) + milkB * visualMilk);

      // 4. Sweetness glaze (caramel amber tones)
      const sweetWeight = sweetness / 20;
      r = Math.min(255, Math.round(r + sweetWeight * 12));
      g = Math.min(255, Math.round(g + sweetWeight * 6));
      b = Math.max(0, Math.round(b - sweetWeight * 8));

      // Clamp RGB
      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));

      const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;

      // Dynamic poetic descriptor based on the exact profile
      let descriptor = "Balanced Caramel";
      let notes = "Toasted Cocoa • Honeyed Crema";

      if (milk <= 8) {
        if (roast >= 4) {
          descriptor = coffee >= 80 ? "Obsidian Dark Espresso" : "Midnight French Roast";
          notes = "Smoky Dark Chocolate • Molasses";
        } else if (roast >= 2) {
          descriptor = coffee >= 80 ? "Intense Ristretto" : "Bold Americano Crema";
          notes = "Toasted Walnut • Cedar";
        } else {
          descriptor = "Golden Blonde Extraction";
          notes = "Meyer Lemon • Floral Honey";
        }
      } else if (milk <= 28) {
        if (roast >= 4) {
          descriptor = "Caramel Bold";
          notes = "Burnt Sugar • Roasted Hazelnut";
        } else if (roast >= 2) {
          descriptor = "Toasted Cortado Hue";
          notes = "Pecan • Dark Cocoa Nibs";
        } else {
          descriptor = "Amber Macchiato";
          notes = "Golden Caramel • Vanilla Pod";
        }
      } else if (milk <= 58) {
        if (roast >= 4) {
          descriptor = "Smoky Mocha Velvet";
          notes = "Bittersweet Cocoa • Velvety Crema";
        } else if (roast >= 2) {
          descriptor = "Balanced Caramel";
          notes = "Buttery Toffee • Warm Cinnamon";
        } else {
          descriptor = "Blonde Silk Flat White";
          notes = "Almond Butter • Sweet Cream";
        }
      } else if (milk <= 78) {
        if (roast >= 4) {
          descriptor = "Hazelnut Café Latte";
          notes = "Milk Chocolate • Roasted Chestnut";
        } else if (roast >= 2) {
          descriptor = "Creamy Honey Latte";
          notes = "Wildflower Honey • Steamed Microfoam";
        } else {
          descriptor = "Silky Vanilla Dawn";
          notes = "Crème Brûlée • Sweet Brioche";
        }
      } else {
        descriptor = roast >= 3 ? "Velvet Cloud au Lait" : "Ivory Silk Crema";
        notes = "Froth Cream • Delicate Espresso Mist";
      }

      // Volumetric breakdown percentages
      const totalParts = coffee + milk;
      const coffeePct = Math.round((coffee / totalParts) * 100);
      const milkPct = 100 - coffeePct;

      const roastNames = ["Light Blonde", "Medium-Light", "Medium Roast", "Medium-Dark", "Dark Italian"];
      const roastLabel = roastNames[roast - 1];

      let sweetLabel = "None";
      if (sweetness >= 15) sweetLabel = "Sweet (15g)";
      else if (sweetness >= 8) sweetLabel = "Medium (10g)";
      else if (sweetness > 0) sweetLabel = "Low (5g)";

      const recipeSummary = `${coffeePct}% Coffee · ${milkPct}% Milk · ${roastLabel} · ${sweetLabel}`;

      return {
        r, g, b, hex, descriptor, notes, coffeePct, milkPct, roastLabel, sweetLabel, recipeSummary
      };
    }

    // 50 Shades of Coffee signature collection for the design matrix
    const SIGNATURE_50_SHADES = [
      { hex: '#160B06', name: 'Obsidian Espresso', coffee: 100, milk: 0, roast: 5, sweetness: 0 },
      { hex: '#23110A', name: 'Midnight French', coffee: 90, milk: 0, roast: 4, sweetness: 0 },
      { hex: '#31180E', name: 'Double Shot Ristretto', coffee: 95, milk: 5, roast: 4, sweetness: 0 },
      { hex: '#422013', name: 'Smoky Dark Roast', coffee: 85, milk: 10, roast: 4, sweetness: 5 },
      { hex: '#582B1B', name: 'Toasted Chestnut', coffee: 80, milk: 15, roast: 3, sweetness: 5 },
      { hex: '#6E3722', name: 'Cortado Bold', coffee: 75, milk: 20, roast: 4, sweetness: 5 },
      { hex: '#7D3F28', name: 'Pecan Macchiato', coffee: 70, milk: 25, roast: 3, sweetness: 10 },
      { hex: '#8E593B', name: 'Caramel Bold', coffee: 72, milk: 28, roast: 4, sweetness: 5 },
      { hex: '#9E6543', name: 'Cinnamon Bark', coffee: 65, milk: 32, roast: 3, sweetness: 5 },
      { hex: '#A96F42', name: 'Balanced Caramel', coffee: 62, milk: 38, roast: 3, sweetness: 8 },
      { hex: '#B57C4F', name: 'Warm Toffee Crema', coffee: 58, milk: 42, roast: 3, sweetness: 10 },
      { hex: '#C28B5E', name: 'Silk Flat White', coffee: 52, milk: 48, roast: 3, sweetness: 5 },
      { hex: '#CD9A6F', name: 'Golden Honey Latte', coffee: 46, milk: 54, roast: 2, sweetness: 10 },
      { hex: '#D7A981', name: 'Hazelnut au Lait', coffee: 40, milk: 60, roast: 3, sweetness: 10 },
      { hex: '#DFB794', name: 'Blonde Velvet', coffee: 35, milk: 65, roast: 1, sweetness: 8 },
      { hex: '#E7C6A8', name: 'Vanilla Steamer', coffee: 28, milk: 72, roast: 2, sweetness: 15 },
      { hex: '#EED5BD', name: 'Dawn Mist Cream', coffee: 22, milk: 78, roast: 2, sweetness: 5 },
      { hex: '#F4E4D3', name: 'Ivory Silk Crema', coffee: 15, milk: 85, roast: 1, sweetness: 0 }
    ];

    // --- QUICK PICKS PRESETS ---
    const PRESETS = [
      { id: 'black', label: 'BLACK', desc: 'Strong · No milk', coffee: 90, milk: 0, roast: 4, sweetness: 0 },
      { id: 'balanced', label: 'BALANCED', desc: 'Medium coffee · Medium milk', coffee: 62, milk: 38, roast: 3, sweetness: 5 },
      { id: 'creamy', label: 'CREAMY', desc: 'Light coffee · High milk', coffee: 30, milk: 75, roast: 2, sweetness: 8 },
      { id: 'bold', label: 'BOLD', desc: 'High coffee · Low milk', coffee: 80, milk: 18, roast: 4, sweetness: 0 },
      { id: 'sweet', label: 'SWEET', desc: 'Balanced coffee · Creamy · Sweet', coffee: 50, milk: 55, roast: 3, sweetness: 18 },
    ];

    // --- PURE SVG QR CODE COMPONENT ---
    function CustomQRCode({ payload, size = 160, hex = '#A96F42' }) {
      const hash = payload.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const cells = 21;
      const grid = useMemo(() => {
        const rows = [];
        for (let r = 0; r < cells; r++) {
          const row = [];
          for (let c = 0; c < cells; c++) {
            const isTopLeft = (r < 7 && c < 7);
            const isTopRight = (r < 7 && c >= cells - 7);
            const isBottomLeft = (r >= cells - 7 && c < 7);

            if (isTopLeft || isTopRight || isBottomLeft) {
              if (r === 0 || r === 6 || c === 0 || c === 6 ||
                  r === 0 || r === 6 || c === cells - 7 || c === cells - 1 ||
                  r === cells - 7 || r === cells - 1 || c === 0 || c === 6) {
                row.push(true);
              } else if (
                (r >= 2 && r <= 4 && c >= 2 && c <= 4) ||
                (r >= 2 && r <= 4 && c >= cells - 5 && c <= cells - 3) ||
                (r >= cells - 5 && r <= cells - 3 && c >= 2 && c <= 4)
              ) {
                row.push(true);
              } else {
                row.push(false);
              }
            } else {
              const val = Math.sin(r * 12.9898 + c * 78.233 + hash) * 43758.5453;
              row.push((val - Math.floor(val)) > 0.46);
            }
          }
          rows.push(row);
        }
        return rows;
      }, [payload, hash]);

      const cellSize = size / cells;

      return (
        <div className="relative inline-block p-3.5 bg-white rounded-2xl shadow-xl border border-white/20">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <rect width={size} height={size} fill="#FFFFFF" />
            {grid.map((row, r) =>
              row.map((active, c) =>
                active ? (
                  <rect
                    key={`${r}-${c}`}
                    x={c * cellSize}
                    y={r * cellSize}
                    width={cellSize}
                    height={cellSize}
                    fill="#1A0D07"
                    rx={cellSize * 0.25}
                  />
                ) : null
              )
            )}
            <circle cx={size / 2} cy={size / 2} r={cellSize * 1.8} fill={hex} stroke="#FFFFFF" strokeWidth="2" />
          </svg>
        </div>
      );
    }

    // --- REALISTIC COFFEE CUP & FLUID CANVAS SIMULATOR ---
    function CoffeeCupCanvas({ colorData, showWindowCallout = false, fillLevel = 1.0, isBrewing = false }) {
      const canvasRef = useRef(null);
      const animationFrameId = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let t = 0;

        const bubbles = Array.from({ length: 24 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height * 0.7) + (canvas.height * 0.25),
          radius: Math.random() * 2.8 + 1.0,
          speed: Math.random() * 0.35 + 0.15,
          offset: Math.random() * Math.PI * 2
        }));

        const render = () => {
          t += 0.035;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const w = canvas.width;
          const h = canvas.height;
          
          const liquidHeight = h * 0.78 * fillLevel;
          const topY = h * 0.88 - liquidHeight;

          if (liquidHeight > 10) {
            ctx.save();
            
            ctx.beginPath();
            ctx.moveTo(w * 0.14, h * 0.12);
            ctx.lineTo(w * 0.86, h * 0.12);
            ctx.lineTo(w * 0.77, h * 0.88);
            ctx.lineTo(w * 0.23, h * 0.88);
            ctx.closePath();
            ctx.clip();

            const gradient = ctx.createLinearGradient(0, topY, 0, h * 0.88);
            gradient.addColorStop(0, `rgb(${colorData.r}, ${colorData.g}, ${colorData.b})`);
            gradient.addColorStop(0.7, `rgb(${Math.max(0, colorData.r - 20)}, ${Math.max(0, colorData.g - 20)}, ${Math.max(0, colorData.b - 20)})`);
            gradient.addColorStop(1, `rgb(${Math.max(0, colorData.r - 35)}, ${Math.max(0, colorData.g - 35)}, ${Math.max(0, colorData.b - 35)})`);

            ctx.beginPath();
            ctx.moveTo(0, topY);
            for (let x = 0; x <= w; x += 4) {
              const wave1 = Math.sin(x * 0.03 + t) * (isBrewing ? 7 : 3.5);
              const wave2 = Math.cos(x * 0.05 - t * 0.8) * (isBrewing ? 5 : 2);
              ctx.lineTo(x, topY + wave1 + wave2);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Crema foam top edge
            ctx.beginPath();
            for (let x = 0; x <= w; x += 4) {
              const wave1 = Math.sin(x * 0.03 + t) * (isBrewing ? 7 : 3.5);
              const wave2 = Math.cos(x * 0.05 - t * 0.8) * (isBrewing ? 5 : 2);
              ctx.lineTo(x, topY + wave1 + wave2);
            }
            ctx.strokeStyle = `rgba(255, 245, 220, 0.45)`;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Bubbles
            bubbles.forEach(b => {
              b.y -= b.speed * (isBrewing ? 2.5 : 1);
              if (b.y < topY + 6) {
                b.y = h * 0.86;
                b.x = w * 0.25 + Math.random() * (w * 0.5);
              }
              const wobble = Math.sin(t + b.offset) * 3;
              ctx.beginPath();
              ctx.arc(b.x + wobble, b.y, b.radius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255, 250, 235, 0.45)`;
              ctx.fill();
            });

            if (isBrewing && fillLevel < 0.98) {
              ctx.beginPath();
              ctx.moveTo(w * 0.5 - 4, 0);
              ctx.lineTo(w * 0.5 + 4, 0);
              ctx.lineTo(w * 0.5 + 6, topY);
              ctx.lineTo(w * 0.5 - 6, topY);
              ctx.closePath();
              ctx.fillStyle = `rgba(${colorData.r}, ${colorData.g}, ${colorData.b}, 0.85)`;
              ctx.fill();
            }

            ctx.restore();
          }

          animationFrameId.current = requestAnimationFrame(render);
        };

        render();

        return () => {
          if (animationFrameId.current) {
            cancelAnimationFrame(animationFrameId.current);
          }
        };
      }, [colorData, fillLevel, isBrewing]);

      return (
        <div className="relative w-full max-w-[280px] mx-auto aspect-[3/4] flex items-center justify-center">
          <div
            className="absolute inset-4 rounded-full blur-3xl opacity-40 transition-colors duration-700 pointer-events-none"
            style={{ backgroundColor: colorData.hex }}
          />

          <canvas
            ref={canvasRef}
            width={280}
            height={360}
            className="absolute inset-0 w-full h-full pointer-events-none z-10"
          />

          <svg className="relative w-full h-full z-20" viewBox="0 0 280 360" fill="none">
            <defs>
              <linearGradient id="cupGlass" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.18" />
                <stop offset="15%" stopColor="#FFFFFF" stopOpacity="0.04" />
                <stop offset="50%" stopColor="#FFFFFF" stopOpacity="0.01" />
                <stop offset="85%" stopColor="#FFFFFF" stopOpacity="0.04" />
                <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.22" />
              </linearGradient>

              <linearGradient id="cupSpec" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.35" />
                <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
              </linearGradient>

                            {s.hex}
                          </div>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-3 pt-4 border-t border-white/10">
                  <span className="text-xs font-mono font-bold uppercase text-neutral-300 block">
                    2. Core Design Tokens & Visual Hierarchy
                  </span>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div className="p-3 rounded-xl bg-white/5 border border-white/10">
                      <div className="font-bold text-white">Typography: Geometric Sans</div>
                      <p className="text-neutral-400 text-[11px] mt-1">
                        Primary: Outfit (clean, futuristic, high legibility from 1 meter distance). Monospace: JetBrains Mono for hex codes, ratios, telemetry.
                      </p>
                    </div>
                    <div className="p-3 rounded-xl bg-white/5 border border-white/10">
                      <div className="font-bold text-white">Restrained Premium Palette</div>
                      <p className="text-neutral-400 text-[11px] mt-1">
                        Obsidian Black (#121212), Espresso Brown (#1A0D07), Warm Cream (#FFF8EE), Caramel (#C87D38). The coffee color provides the primary visual vibrancy.
                      </p>
                    </div>
                  </div>
                </div>

                <div className="space-y-2 pt-4 border-t border-white/10">
                  <span className="text-xs font-mono font-bold uppercase text-neutral-300 block">
                    3. Physical Cup Specification
                  </span>
                  <div className="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-neutral-300 space-y-1">
                    <div className="font-bold text-amber-400">Transparent Center Square Window:</div>
                    <p className="text-[11px]">
                      48mm × 48mm optical acrylic window bonded directly to the double-walled matte charcoal vessel. Provides immediate physical verification of the digital Hex code shade.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<LiquidPaletteApp />);
  </script>
</body>
</html>
